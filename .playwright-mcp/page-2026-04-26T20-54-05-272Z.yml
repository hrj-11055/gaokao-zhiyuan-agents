              - paragraph [ref=e255]:
                - text: 学科专业强劲，培养出来的学生实力也相当不俗。据广外2024年《毕业生就业质量年度报告》显示，
                - strong [ref=e257]: 2023届毕业生总体毕业去向落实率为95.39%，其中本科毕业生毕业去向落实率95.36%
                - text: 。
              - paragraph [ref=e258]
              - paragraph [ref=e259]: 据统计，重点用人单位主要有外交部、商务部等机关事业单位；中国银行、华为、宝洁、四大会计师事务所等；世界500强及中国500强企业。
