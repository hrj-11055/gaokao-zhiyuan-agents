              - paragraph [ref=e376]: 广东工业大学是一所以工为主、工理经管文法艺教结合、多科性协调发展的省属重点大学、广东省高水平大学重点建设高校。2024泰晤士高等教育世界大学排名位列大陆高校第41—57位，2024软科世界大学学术排名位列全球第301—400名。
              - paragraph [ref=e377]
