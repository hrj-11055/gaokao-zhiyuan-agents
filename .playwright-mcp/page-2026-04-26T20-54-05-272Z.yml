              - paragraph [ref=e333]
              - paragraph [ref=e334]: 根据广州医科大学发布的2023-2024学年本科教学质量报告，2024年共有本科毕业生5529人，实际毕业人数5328人，毕业率为96.19%，学位授予率为95.61%。
              - paragraph [ref=e335]
              - paragraph [ref=e336]: 学校2024届应届本科毕业生初次去向落实率为80.16%。毕业生最主要的毕业去向是事业单位1526人，占27.60%；升学1196人，占21.63%，企业单位1399 人，占25.30%。
