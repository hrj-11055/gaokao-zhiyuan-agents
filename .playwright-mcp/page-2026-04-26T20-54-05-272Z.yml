              - paragraph [ref=e238]:
                - text: 学校现有1个国家级重点学科和8个省级重点学科。在教育部学位与研究生教育发展中心组织开展的几轮学科评估中，我校外国语言文学学科均位居全国高校前列。2021年学校入选广东省“冲补强”提升计划高水平大学重点建设高校，5个学科入选高水平大学重点建设学科。
                - strong [ref=e239]: 社会科学总论、工程学学科位居ESI全球前1%。
