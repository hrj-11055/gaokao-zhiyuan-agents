                  - generic [ref=e221]:
                    - text: 广东外语外贸大学是广东省高水平大学重点建设高校、是
                    - strong [ref=e223]: 华南地区外语语种最多、高层次外语人才最集中
                    - text: 的高校，现有白云山、大学城、大朗3个校区。
                - paragraph [ref=e224]
                - paragraph [ref=e225]: 学校具有鲜明的国际化特色，是华南地区国际化人才培养，外国语言文学、全球治理、涉外法治研究及中华文化国际传播的重要基地。学校1981年获硕士学位授予权，1986年获博士学位授予权，是中国恢复研究生制度后较早获得硕士、博士授予权的单位。
