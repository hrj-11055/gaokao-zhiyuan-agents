                - strong [ref=e140]: 华南理工大学
              - paragraph [ref=e141]
              - paragraph [ref=e142]: 华南理工大学是直属教育部的全国重点大学，国家“双一流”、“211工程”和“985工程”重点建设高校。学校办学源远流长，最早可溯源至1918年成立的广东省立第一甲种工业学校（世称“红色甲工”）；正式组建于1952年全国高等院校调整时期，是新中国“四大工学院”之一。
              - paragraph [ref=e143]
              - strong [ref=e152]: 优势学科：
              - paragraph [ref=e154]
              - paragraph [ref=e155]: 华南理工大学已经发展为一所以工见长，理工医结合，管、经、文、法等多学科协调发展的综合性研究型大学。
              - paragraph [ref=e156]
              - paragraph [ref=e157]:
                - strong [ref=e159]: 化学、材料科学与工程、轻工技术与工程、食品科学与工程
                - generic [ref=e160]:
                  - text: 4个学科入选“双一流”；33个专业入选全国第四轮学科评估，其中
                  - strong [ref=e162]: 轻工技术与工程获评A+
                  - text: 。16个学科领域进入ESI全球排名前1%，其中，
                - strong [ref=e164]: 工程学进入全球前万分之一
                - text: ；材料科学、化学、农业科学、计算机科学跻身全球前1‰。
              - paragraph [ref=e165]
              - strong [ref=e174]: 本科毕业生就业情况：
              - paragraph [ref=e176]
              - paragraph [ref=e177]: 建校以来，学校为国家培养了高等教育各类学生60余万人，毕业生就业率多年来位居全国高校和广东省高校前列，一大批毕业校友成为我国科技骨干、著名企业家和领导干部。学校被誉为“工程师的摇篮”“企业家的摇篮”“新能源汽车界的黄埔军校”，入选全国大众创业万众创新示范基地。
              - paragraph [ref=e178]
              - paragraph [ref=e179]: 学校2024届全日制本科毕业生共6526人，其中6122人正常毕业，毕业率为93.81%，已毕业人员学位授予率为100%。2023届毕业生就业工作依然保持充分就业和高质量就业。
              - paragraph [ref=e180]
              - paragraph [ref=e181]:
                - generic [ref=e182]:
                  - text: 截至2023年12月10日，
                  - strong [ref=e184]: 学校2023届本科毕业去向落实率97.65%
                  - text: 。在升学方面，46.26%的本科生选择继续深造，相比2022届增加了2.43个百分点。
              - paragraph [ref=e185]
              - paragraph [ref=e186]: 其中，本科生境内升学2245人，占比36.35%，境内升学九成以上流向“双一流”建设高校；本科生国（境）外留学612人，占比9.91%，国（境）外留学超七成赴QS世界排名前100高校。
