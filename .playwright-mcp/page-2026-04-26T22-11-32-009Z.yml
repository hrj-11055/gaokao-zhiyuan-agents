            - paragraph [ref=e265]:
              - text: 县级
              - emphasis [ref=e266]: 医保局
              - text: 的工资水平受地区经济水平、财政状况、职位等级、编制类型（
              - emphasis [ref=e267]: 公务员
              - text: /
              - emphasis [ref=e268]: 事业编
              - text: /合同制）等因素影响，具体范围大致如下： 一、基本工资结构 1.
              - emphasis [ref=e269]: 公务员
              - text: 编制（如行政岗） - 基本工资：按国家统一职级标准（如科员约3000-4000元/月，副科级约4000-5000元/月）。 - 补贴津贴：包括生活补贴、交通补贴、通讯补贴等，因地区差异较大（如经济发达地区可能多1000-2000元/月）。 - 年终奖/绩效：部分县市有年终考核奖（1-3个月工资）。 - 合计：月收入通常 4000-7000元（中西部欠发达地区偏低，东部沿海或经济强县可能更高）。 2.
              - emphasis [ref=e270]: 事业编
              - text: 制（如医保中心
              - emphasis [ref=e271]: 工作人员
              - text: ） - 专业技术岗：按职称等级（初级约3000-5000元/月，中级5000-7000元/月）。 - 管理岗：类似
              - emphasis [ref=e272]: 公务员
              - text: 科员级。 - 合计：与
              - emphasis [ref=e273]: 公务员
              - text: 编制相近，但绩效分配可能不同。 3. 合同制人员 - 工资较低，通常 2000-4000元/月，五险一金按最低标准缴纳。 二、地区差异示例 - 东部沿海县市（如浙江、江苏）：
              - emphasis [ref=e274]: 公务员
              - text: 科员年收入约8-12万元（含公积金）。 - 中西部普通县市：
              - emphasis [ref=e275]: 公务员
              - text: 科员年收入约5-8万元。 - 贫困县：可能低于5万元，但有专项补贴。 三、其他福利 - 五险一金：
              - emphasis [ref=e276]: 公务员
              - text: 和
              - emphasis [ref=e277]: 事业编
              - text: 缴费比例高（如公积金12%）。 - 社保
              - emphasis [ref=e278]: 待遇
              - text: ：医保报销比例高，部分有补充医疗保险。 - 稳定性：编制内岗位稳定性强，调薪随政策调整。 四、注意事项 - 具体薪资需咨询当地人社局或
              - emphasis [ref=e279]: 医保局
              - text: ，同一省内不同县也可能差异显著。 - 改革影响：部分地区推行绩效改革，基本工资占比降低，绩效浮动加大。 建议通过当地政府官网、招聘公告或熟人了解最新情况。
