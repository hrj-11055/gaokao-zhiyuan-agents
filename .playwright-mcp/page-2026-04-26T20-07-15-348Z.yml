          - heading "4、汕头大学简介" [level=2] [ref=e3881]
          - paragraph [ref=e3882]: 汕头大学（Shantou University），位于广东省汕头市，是一所由广东省人民政府举办的广东省属综合性大学，入选教育部“卓越工程师教育培养计划”、“卓越医生教育培养计划”、中国政府奖学金来华留学生接收院校，为广东省高水平大学重点学科建设高校、广东省高等教育体制机制改革实验示范校、CDIO国际工程教育合作组织成员。
          - paragraph [ref=e3883]:
            - text: 学校于1981年经国务院批准成立汕头大学，同年9月，教育部批准汕头医学
            - link "专科学校" [ref=e3884] [cursor=pointer]:
              - /url: /news/list_134.html
            - text: 并入汕头大学，设为汕头大学医学院。
