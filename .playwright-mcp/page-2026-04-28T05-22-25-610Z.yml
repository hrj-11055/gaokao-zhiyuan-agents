            - generic [ref=e189]:
              - generic [ref=e190]: 文物保护与修复专业是一门将文、理、艺、工交叉结合的学科，就业前景伴随国家对文化遗产保护的重视而日益广阔。以下是根据2025-2026年数据整理的专业详析：
              - heading "一、 就业前景与方向" [level=3] [ref=e191]
              - generic [ref=e193]:
                - text: 随着我国文博事业的发展，该专业毕业生不再局限于传统的博物馆修复岗位，呈现出“技术+艺术”复合型人才需求增长的趋势。
