      - heading "暨南大学2024年各批次录取分数线概览：最低396分可录取，较上年高出51分" [level=1] [ref=e53]
      - generic [ref=e54]:
        - text: 李老师
        - time [ref=e55]: 2025-07-24 13:06:43
      - article [ref=e56]:
        - paragraph [ref=e57]: 暨南大学2024年各批次录取分数线因省份而有所不同。在广东，物理类(普通类)最低录取分数为583分，历史类(普通类)最低录取分数为582分;在上海，最低录取分数为534分;在云南，理科(普通类)最低录取分数为575分，文科(普通类)最低录取分数为599分;在内蒙古，理科(普通类)最低录取分数为525分，文科(普通类)最低录取分数为538分;在北京，最低录取分数为605分;在吉林，物理类(普通类)最低录取分数为562分，历史类(普通类)最低录取分数为573分。2024年，暨南大学设有国家/地方专项，提前批（本科），新高考(3+3模式)一段和本科批招生计划。以下是暨南大学2024年各省最低录取分数线的汇总，供大家参考查阅。
