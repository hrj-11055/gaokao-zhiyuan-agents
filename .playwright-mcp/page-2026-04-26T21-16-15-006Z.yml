          - heading "四、暨南大学简介" [level=2] [ref=e3995]
          - paragraph [ref=e3996]:
            - text: 暨南大学（Jinan University）简称“暨大”，是直属中央统战部领导，教育部、中央统战部、广东省三方共建大学；是国家“
            - link "双一流" [ref=e3997] [cursor=pointer]:
              - /url: /news/list_178.html
            - text: ”，国家“211工程”、“
            - link "985" [ref=e3998] [cursor=pointer]:
              - /url: /news/list_195.html
            - text: 平台”重点建设高校；入选国家“111计划”、“2011计划”、卓越医生教育培养计划、卓越法律人才教育培养计划、国家
            - link "大学生" [ref=e3999] [cursor=pointer]:
              - /url: /
            - text: 创新性实验计划、国家级大学生创新
            - link "创业" [ref=e4000] [cursor=pointer]:
              - /url: /news/list_36.html
            - text: 训练计划、教育部人文社会科学重点研究基地、国家大学生文化素质教育基地、国家对外汉语教学基地、国务院侨办华文教育基地、国家建设高水平大学公派
            - link "研究生" [ref=e4001] [cursor=pointer]:
              - /url: /news/list_41.html
            - text: 项目、新工科研究与实践项目、中国政府奖学金来华留学生接收院校、全国首批深化创新创业教育改革示范高校；为粤港澳大湾区物流与供应链创新联盟理事单位；是全国首批试行学分制的高校。
          - paragraph [ref=e4002]:
            - text: 学校的前身是1906年清政府创立于南京的暨南学堂。后迁至
            - link "上海" [ref=e4003] [cursor=pointer]:
              - /url: /news/list_116.html
            - text: ，1927年更名为国立暨南大学。抗日战争期间，迁址
            - link "福建" [ref=e4004] [cursor=pointer]:
              - /url: /news/list_112.html
            - text: 建阳。1946年迁回上海，1949年8月合并于复旦大学、交通大学等高校。新中国成立后，暨南大学于1958年在广州重建，“文革”期间一度停办，1978年在广州复办。
