              - text: 》，设置5个新医科人才培养引导性专业，其中包括健康与医疗保障专业。
              - superscript [ref=e579] [cursor=pointer]:
                - text: "[1]"
                - emphasis
              - superscript [ref=e581] [cursor=pointer]:
                - text: "[3]"
                - emphasis
              - text: 从课程设置上看，5个新设专业均属于“交叉融合”，其中健康与医疗保障专业属于医理文交叉。
              - superscript [ref=e583] [cursor=pointer]:
                - text: "[3]"
                - emphasis
              - superscript [ref=e585] [cursor=pointer]:
                - text: "[12]"
                - emphasis
              - text: 该专业是在现有医疗保险专业的基础上进行的一次全面“扩展与升级”。
              - superscript [ref=e587] [cursor=pointer]:
                - text: "[6]"
                - emphasis
            - generic [ref=e588]:
              - heading "发展历史" [level=2] [ref=e589]
              - generic [ref=e592] [cursor=pointer]:
                - img [ref=e593]
                - generic [ref=e596]: 播报
              - generic [ref=e597] [cursor=pointer]:
                - img [ref=e598]
                - generic [ref=e600]: 编辑
            - generic [ref=e601]: 2024年1月4日，教育部制定发布《服务健康事业和健康产业人才培养引导性专业指南》，设置健康与医疗保障专业。
            - generic [ref=e602]:
              - text: 2025年4月22日，教育部发布2024年度普通高等学校本科专业备案和审批结果，在服务国家战略方面，增设了健康与医疗保障等专业。
              - superscript [ref=e604] [cursor=pointer]:
                - text: "[2]"
                - emphasis
            - generic [ref=e605]:
              - heading "培养目标" [level=2] [ref=e606]
              - generic [ref=e609] [cursor=pointer]:
                - img [ref=e610]
                - generic [ref=e613]: 播报
              - generic [ref=e614] [cursor=pointer]:
                - img [ref=e615]
                - generic [ref=e617]: 编辑
            - generic [ref=e618]: 本专业培养掌握健康服务、医疗保险、社会保障基本知识，熟悉健康治理的基本理论、健康保障相关法律法规，具有应用医疗保险管理技术和健康保障决策支持能力，能够在医疗保险部门、社会保障机构或医疗卫生单位，从事医疗保险管理、健康保险核保与理赔、健康保障政策开发与评估相关工作的专业型人才。
            - generic [ref=e619]:
              - heading "课程体系" [level=2] [ref=e620]
              - generic [ref=e623] [cursor=pointer]:
                - img [ref=e624]
                - generic [ref=e627]: 播报
              - generic [ref=e628] [cursor=pointer]:
                - img [ref=e629]
                - generic [ref=e631]: 编辑
            - generic [ref=e632]:
              - text: 健康与医疗保障专业属于医理文交叉融合，课程体系体现医学基础、医保政策、管理能力与信息技术的交叉。
              - superscript [ref=e634] [cursor=pointer]:
                - text: "[3]"
                - emphasis
            - heading "核心课程" [level=3] [ref=e636]
            - generic [ref=e637]:
              - text: 基础医学概论、临床医学概论、社会医学、医学伦理学、管理学基础、公共行政学、社会保障概论、卫生事业管理学、卫生经济学、医疗保险学、卫生统计学、计量经济学、人工智能导论、社会科学研究方法。
              - superscript [ref=e639] [cursor=pointer]:
                - text: "[4-5]"
                - emphasis
                - emphasis
              - superscript [ref=e641] [cursor=pointer]:
                - text: "[7]"
                - emphasis
              - superscript [ref=e643] [cursor=pointer]:
                - text: "[9-10]"
                - emphasis
                - emphasis
              - superscript [ref=e645] [cursor=pointer]:
                - text: "[14-15]"
                - emphasis
                - emphasis
            - heading "主要实践教学环节" [level=3] [ref=e647]
            - generic [ref=e648]:
              - text: 包括卫生决策仿真实验、保障政策角色扮演磋商会、健康保险产品设计实训等互动类课程学习，医疗机构、省市医保局专业见习，以及毕业实习、社会实践、科研训练、毕业论文（毕业设计）等。
              - superscript [ref=e650] [cursor=pointer]:
                - text: "[4-5]"
                - emphasis
                - emphasis
              - superscript [ref=e652] [cursor=pointer]:
                - text: "[14-15]"
                - emphasis
                - emphasis
            - generic [ref=e653]:
              - heading "实践教学环节" [level=2] [ref=e654]
              - generic [ref=e657] [cursor=pointer]:
                - img [ref=e658]
                - generic [ref=e661]: 播报
              - generic [ref=e662] [cursor=pointer]:
                - img [ref=e663]
                - generic [ref=e665]: 编辑
            - generic [ref=e666]: 卫生决策仿真实验、保障政策角色扮演磋商会、健康保险产品设计实训等互动类课程学习，医疗机构、省市医保局专业见习，以及毕业实习、社会实践、科研训练、毕业论文（毕业设计）等。
            - generic [ref=e667]:
              - heading "发展前景" [level=2] [ref=e668]
              - generic [ref=e671] [cursor=pointer]:
                - img [ref=e672]
                - generic [ref=e675]: 播报
              - generic [ref=e676] [cursor=pointer]:
                - img [ref=e677]
                - generic [ref=e679]: 编辑
            - generic [ref=e680]:
              - text: 健康与医疗保障专业是面向人民生命健康、服务健康事业和健康产业发展新态势而设立的引导性专业。随着慢性病和退行性疾病患者规模不断扩大，健康与医疗保障等领域的复合型人才需求也将不断增加
              - superscript [ref=e682] [cursor=pointer]:
                - text: "[3]"
                - emphasis
              - superscript [ref=e684] [cursor=pointer]:
                - text: "[12]"
                - emphasis
              - text: 。我国医疗保障制度改革不断推进，医保覆盖范围扩大、支付方式改革深入、医疗服务体系加速优化，医疗保障领域对专业人才的需求快速增长。
            - generic [ref=e685]:
              - text: 该专业以科技发展和职业需求为导向，通过深化医工、医理、医文学科交叉融合的教育改革开展人才培养
              - superscript [ref=e687] [cursor=pointer]:
                - text: "[3]"
                - emphasis
              - text: 。专业特色体现为医学与管理交叉融合，既具备医学基础又具备管理与政策执行能力，并紧密对接“
              - link "健康中国" [ref=e689] [cursor=pointer]:
                - /url: /item/%E5%81%A5%E5%BA%B7%E4%B8%AD%E5%9B%BD/19924341?fromModule=lemma_inlink
              - text: ”“医保改革”等国家战略。其培养目标是使学生掌握健康服务、医疗保险、社会保障基本知识，熟悉健康治理的基本理论、健康保障相关法律法规，具有应用医疗保险管理技术和健康保障决策支持能力
              - superscript [ref=e691] [cursor=pointer]:
                - text: "[4-5]"
                - emphasis
                - emphasis
              - superscript [ref=e693] [cursor=pointer]:
                - text: "[14-15]"
                - emphasis
                - emphasis
              - text: 。
            - generic [ref=e694]:
              - text: 毕业生就业前景广阔，主要面向医疗保障体系、医疗服务体系和健康产业。就业去向包括医疗保险部门、社会保障机构、商业保险公司或医疗卫生单位，从事医疗保险管理、健康保险核保与理赔、健康保障政策开发与评估等相关工作
              - superscript [ref=e696] [cursor=pointer]:
                - text: "[4]"
                - emphasis
              - superscript [ref=e698] [cursor=pointer]:
                - text: "[8]"
                - emphasis
              - superscript [ref=e700] [cursor=pointer]:
                - text: "[11]"
                - emphasis
              - text: 。具体可在各级医疗保障局及相关事业单位、医疗保险经办机构、各级医院医保办及运营管理部门、商业保险公司（健康险方向）、健康管理公司、医疗大数据企业、医疗咨询机构及第三方支付审核机构等单位就业。毕业生就业范围较广，涵盖了医疗卫生机构、保险公司、健康管理机构、政府部门及医药企业等多个领域
              - superscript [ref=e702] [cursor=pointer]:
                - text: "[16]"
                - emphasis
              - text: 。
            - generic [ref=e703]: 适合报考此专业的学生应具备对医学、健康管理、医疗保障政策等领域的兴趣，较强的分析解决问题及沟通交流能力，并希望未来从事医疗保障管理、医疗机构运营管理、健康管理等工作。
