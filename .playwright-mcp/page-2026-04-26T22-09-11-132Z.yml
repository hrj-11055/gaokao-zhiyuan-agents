                      - generic [ref=e364]: 人工智能教育
                      - generic [ref=e365]: 人工智能教育是中国普通高等学校本科专业，属教育学类，专业代码为040117TK，基本修业年限四年，授予教育学学士学位。2025年4月22日，教育部发布2024年度普通高等学校本科专业备案和审批结果，增设该专业，北京师范大学为首批开设高校。该专业遵循“基础性、前沿性、交叉性”原则，构建人工智能通识-专业-实践分层课程体系，形成技术模块（生成式人工智能、机器学习）与教育模块（教育理论、课程设计）相结合的“双螺旋”课程结构，采用“高校+企业+中小学”三位一体培养模式，目标为培养AI领域创新型人才。河南省提出在计算机科学与技术学科设置人工智能方向，支持建设实习实训基地，陕西省将《人工智能导论》纳入本科必修课程全覆盖，并布局建设人工智能学院。西安交通大学2018年招收首批人工智能专业本科生，开展核心课程体系与AI交互课堂建设探索。北京师范大学通过人工智能教学应用示范课程建设工作坊，打造课程专属AI助教及智慧教学系统。
                  - link "婴幼儿发展与健康管理 婴幼儿发展与健康管理是一门高等职业教育本科专业，属医药卫生大类专业，基本修业年限为四年，授予管理学学士学位。2021年，婴幼儿发展与健康管理列入《职业教育专业目录（2021年）》。该专业培养德智体美劳全面发展，掌握扎实的科学文化基础和婴幼儿生理学、发展心理学、卫生保健、营养喂养、急救护理等知识，具备婴幼儿回应性照料、游戏活动设计与实施、婴幼儿观察与评估、伤害预防与处理、疾病识别与护理、照护者指导与咨询、机构创立与管理等能力，具有敬佑生命、甘于奉献、大爱无疆的职业精神和信息素养，能够从事婴幼儿的生活照料、学习支持、安全保障、健康管理、合作共育以及婴幼儿照护机构建设管理等工作的高层次技术技能人才。" [ref=e366] [cursor=pointer]:
