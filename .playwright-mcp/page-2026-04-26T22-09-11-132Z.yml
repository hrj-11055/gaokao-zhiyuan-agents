                  - link "航空运动 航空运动是中国普通高等学校本科专业，隶属于体育学类，修业年限四年，授予教育学学士学位。该专业于2025年经教育部批准增设，吉林体育学院成为全国首批开设该专业的高校，2025年首批计划招收90人。专业定位为培养低空经济复合型人才，核心课程涵盖滑翔伞、动力伞、热气球、无人机等航空运动项目，构建包含空气动力学、航空法规等理论课程及飞行操控实践相结合的课程体系。采用“三阶淬炼”培养模式，开展校企共建订单式培养，要求掌握飞行原理、气象学等技术规范，并通过VR模拟强化安全训练。该专业设置响应国家低空经济发展战略，2023年中国低空经济规模超5000亿元，2030年预计达2万亿元，但行业持证教练及专业人才缺口显著。吉林体育学院基于前期滑翔伞定制班试点经验，联合航空运动产业基地建立实践教学体系。" [ref=e373] [cursor=pointer]:
