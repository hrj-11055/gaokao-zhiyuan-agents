                  - link "区域国别学 区域国别学是中国普通高等学校本科专业，属外国语言文学类专业，专业代码为0502104TK，基本修业年限四年，授予文学学士学位。该专业作为交叉学科，融合外语、政治、经济、历史、文化、国际关系等多学科理论与方法，旨在培养具备国际视野和跨文化交流能力的复合型人才，要求学生掌握对象国语言并开展实地调研。2022年，国务院学位委员会将其列为交叉学科门类下的一级学科，授予经济学、法学、文学或历史学学位。湘潭大学、华侨大学等高校相继成立区域国别研究院，构建本硕博多层次人才培养体系。北京大学区域与国别研究院通过跨学科课程和国际田野调查推动学科建设，广西高校则依托地缘优势重点开展东盟区域国别研究。2025年4月22日，教育部在2024年度普通高等学校本科专业备案和审批结果中增设该专业，北京外国语大学为首批开设院校。" [ref=e380] [cursor=pointer]:
