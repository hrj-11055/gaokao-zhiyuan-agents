                - generic [ref=e358]:
                  - link "人工智能教育 人工智能教育是中国普通高等学校本科专业，属教育学类，专业代码为040117TK，基本修业年限四年，授予教育学学士学位。2025年4月22日，教育部发布2024年度普通高等学校本科专业备案和审批结果，增设该专业，北京师范大学为首批开设高校。该专业遵循“基础性、前沿性、交叉性”原则，构建人工智能通识-专业-实践分层课程体系，形成技术模块（生成式人工智能、机器学习）与教育模块（教育理论、课程设计）相结合的“双螺旋”课程结构，采用“高校+企业+中小学”三位一体培养模式，目标为培养AI领域创新型人才。河南省提出在计算机科学与技术学科设置人工智能方向，支持建设实习实训基地，陕西省将《人工智能导论》纳入本科必修课程全覆盖，并布局建设人工智能学院。西安交通大学2018年招收首批人工智能专业本科生，开展核心课程体系与AI交互课堂建设探索。北京师范大学通过人工智能教学应用示范课程建设工作坊，打造课程专属AI助教及智慧教学系统。" [ref=e359] [cursor=pointer]:
