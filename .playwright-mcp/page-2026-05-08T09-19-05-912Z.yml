          - list [ref=e115]:
            - listitem [ref=e116]: 2026 年数据即将更新，每年数据定时更新；
            - listitem [ref=e117]: 全国高校各专业在全国各省的详细录取数据，从 2018 年至 2025 年；
            - listitem [ref=e118]: 一千多万条已智能校对数据；
            - listitem [ref=e119]: 提供按照高校分组的专业枚举信息前置查询接口；
            - listitem [ref=e120]: 在已有数据基础上，有定制化的接口也可联系我们；
            - listitem [ref=e121]: 多种查询参数条件便于多维度分析；
            - listitem [ref=e122]: 返回数据包含该专业录取的最低分、最高分、平均分、最低位次等信息；
            - listitem [ref=e123]: 数据持续更新与维护；
            - listitem [ref=e124]: 毫秒级查询性能；
            - listitem [ref=e125]: 全接口支持 HTTPS（TLS v1.0 / v1.1 / v1.2 / v1.3）；
            - listitem [ref=e126]: 接口安全标准全面兼容 Apple ATS；
            - listitem [ref=e127]: 全国多节点 CDN 部署；
            - listitem [ref=e128]: 接口极速响应，多台服务器构建 API 接口负载均衡。
