          - paragraph [ref=e522]: 汕头大学（Shantou University），位于广东省汕头市，是一所由广东省人民政府举办的广东省属综合性大学，入选教育部“卓越工程师教育培养计划”、“卓越医生教育培养计划”、中国政府奖学金来华留学生接收院校，为广东省高水平大学重点学科建设高校、广东省高等教育体制机制改革实验示范校、CDIO国际工程教育合作组织成员。
          - paragraph [ref=e523]:
