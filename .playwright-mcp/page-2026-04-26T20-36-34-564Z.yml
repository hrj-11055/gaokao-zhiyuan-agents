              - generic [ref=e190]: 2024年藏药学专业的就业前景在民族医药领域具有特色优势，主要集中在西藏及相关民族地区。近年来，随着藏医药现代化和企业对核心人才的需求增加，薪资水平呈现逐年上升的趋势。
              - generic [ref=e191]: 以下是基于2024年趋势的藏药学专业就业与薪酬分析：
              - heading "一、 就业率与方向" [level=3] [ref=e192]
              - list [ref=e193]:
                - listitem [ref=e194]:
                  - generic [ref=e195]:
                    - strong [ref=e196]: 就业方向：
                    - text: 藏药学毕业生主要在
                    - strong [ref=e197]: 藏医药企业
                    - text: 、
                    - strong [ref=e198]: 医院（药剂科/制剂室）
                    - text: 、
                    - strong [ref=e199]: 藏药研究机构
                    - text: 以及
                    - strong [ref=e200]: 药物监管部门
                    - text: 工作。具体岗位包括藏药鉴定、炮制、制剂、技术研发、学术推广及药店专业岗位等。
                - listitem [ref=e201]:
                  - generic [ref=e202]:
                    - strong [ref=e203]: 就业热门企业：
                    - text: 如奇正藏药等企业在现代藏药研究、学术循证等方面持续投入，提供了相应研发和学术推广岗位。
                - listitem [ref=e204]:
                  - generic [ref=e205]:
                    - strong [ref=e206]: 优势地区：
                    - text: 西藏自治区、青海省及四川、云南部分民族自治州。
