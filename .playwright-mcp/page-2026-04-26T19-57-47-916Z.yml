            - heading "三、考上暨南大学意味着什么" [level=3] [ref=e1450]
            - paragraph [ref=e1451]: 考上暨南大学意味着：你将在国内拔尖的大学中接受教育！
            - paragraph [ref=e1452]: 暨南大学是我国知名的211、卓越医生、卓越法律、中央部属、保研资格、卓越医生(中医)、双万计划、国家重点、双一流大学，是位于广东广州的本科公办大学。
            - paragraph [ref=e1453]: 暨南大学有保研资格、有硕士点、有博士点，在世界大学中排名第345名（U.S.News世界大学排名），在中国本科大学中排名第40名（金平果本科院校竞争力排名），在大学生本科竞赛排行榜中位列第141名。
            - paragraph [ref=e1454]: 再看就业情况，暨南大学2025年超超22位毕业生被中国烟草录用，毕业生在暨南大学就读的专业包含汉语言文学、会计、产业经济学、新闻与传播、物联网工程、工业工程与管理、法学、计算机科学与技术、网络空间安全、传播学、法律（非法学）、信息安全、新闻学、软件工程、工商管理、人力资源管理、计算数学、通信与信息系统、会计学、资产评估、自动化、法律（法学）。暨南大学2025年超8位毕业生被国家电网录用。2024年超93位毕业生以选调生的方式进入体制内。这些都意味着，考上暨南大学后：你不仅能学有所成，而且还能找到好工作！
